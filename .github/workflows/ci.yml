# Tests à chaque pull request et à chaque push sur main,
# puis, pour une pull request, mise en ligne sur l'environnement de test (projet toposhare-test, sans aucun accès à la prod).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6   # requis par l'émulateur Firestore
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    # Une seule URL de test : les déploiements passent l'un après l'autre, le dernier gagne.
    concurrency:
      group: preview
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Numéro de PR dans le bandeau
        run: |
          sed -i "s/window.TS_PREVIEW_PR = \"\";/window.TS_PREVIEW_PR = \"$PREVIEW_PR\";/" public/config.js
          grep -q "TS_PREVIEW_PR = \"$PREVIEW_PR\"" public/config.js

      - name: Clé du projet de test
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOPOSHARE_TEST }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Site et règles sur le projet de test
        run: npx firebase deploy --config firebase.preview.json --only hosting,firestore:rules --project toposhare-test --non-interactive

      - name: Référence figée et jeu de données fictif
        run: node scripts/seed-preview.mjs

      - name: Contrôle du site en ligne
        run: npx playwright test -c playwright.preview.config.js

      - name: URL sur la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PREVIEW_PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Environnement de test : https://toposhare-test.web.app (commit ${{ github.event.pull_request.head.sha }}). Une seule URL partagée entre les PR : la dernière déployée s'affiche, voir le numéro dans le bandeau."
